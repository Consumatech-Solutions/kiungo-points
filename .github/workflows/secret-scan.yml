# Fails the check if a pull request adds a password, key or token (SEC-01 3.2, 6.5).
# Run it by hand from the Actions tab ("Run workflow") to scan the repo's whole history.
name: secret-scan
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1 (checksum pinned)
        run: |
          f=gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$f"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $f" | sha256sum -c -
          tar xzf "$f" gitleaks
      - name: Scan for secrets
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Pull request: only the commits it adds. Manual run: the whole history.
          if [ -n "$BASE" ]; then range="--log-opts=$BASE..HEAD"; else range=""; fi
          ./gitleaks git $range --redact --no-banner --verbose .
